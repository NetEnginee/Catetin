server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;
    charset utf-8;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Block access to hidden files and directories (e.g. .git, .env)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct HTTP access to sensitive files
    location ~* \.(env|md|json|lock|yml|yaml|sql|log|git)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct HTTP access to application internal directories
    location ~ ^/(src|docker|\.context|\.git|vendor)/ {
        deny all;
        return 404;
    }

    # MVC front controller routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM fastcgi handling
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Static assets (no caching during development)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        access_log off;
        try_files $uri =404;
    }
}
